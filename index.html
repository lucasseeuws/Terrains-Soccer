<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadio — Terrains de soccer à Montréal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4EF;
    --panel:#FFFFFF;
    --line:#DDE1D6;
    --ink:#16241A;
    --ink-dim:#6B7568;
    --accent-dark:#122A1C;
    --accent-dark-2:#1C3C28;
    --on-accent:#F1F3EC;
    --on-accent-dim:#9FB0A2;
    --floodlight:#2E7D4F;
    --libre:#2F9E5C;
    --occupe:#D9483A;
    --bientot:#DE8A25;
    --signale:#3D7FC4;
    --radius:10px;
    --shadow:0 8px 22px rgba(15,30,20,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;overflow:hidden;}
  ::selection{background:var(--floodlight);color:#fff;}
  button,input,select{font-family:inherit;}

  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Bandeau (dark) ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:linear-gradient(180deg,var(--accent-dark-2),var(--accent-dark));
    flex-shrink:0;z-index:20;
  }
  .wordmark{display:flex;align-items:baseline;gap:10px;}
  .wordmark .dot{width:10px;height:10px;border-radius:50%;background:var(--libre);box-shadow:0 0 0 3px rgba(47,158,92,.30);flex-shrink:0;align-self:center;}
  .wordmark h1{
    font-family:'Teko',sans-serif;font-weight:600;font-size:32px;letter-spacing:.5px;
    margin:0;color:var(--on-accent);line-height:1;text-transform:uppercase;
  }
  .wordmark span.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--on-accent-dim);letter-spacing:.04em;}
  .top-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--on-accent-dim);text-align:right;}
  .top-meta b{color:#fff;font-weight:500;}

  /* ---------- Filtres ---------- */
  .filters{
    display:flex;gap:8px;padding:10px 22px;background:var(--bg);
    border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;
    align-items:center;
  }
  .chip{
    font-weight:600;font-size:13px;
    padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-dim);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .chip:hover{border-color:var(--floodlight);}
  .chip.active{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}
  .chip.disabled{opacity:.4;cursor:not-allowed;}
  .chip.disabled:hover{border-color:var(--line);}

  /* ---------- Corps ---------- */
  main.split{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;background:#E7EAE1;}
  aside.list{
    width:400px;flex-shrink:0;border-left:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column;min-height:0;
  }
  .list-head{
    padding:14px 18px;background:var(--accent-dark);flex-shrink:0;
  }
  .list-head h2{
    font-family:'Teko',sans-serif;font-weight:600;font-size:20px;margin:0 0 2px;
    text-transform:uppercase;letter-spacing:.03em;color:var(--on-accent);
  }
  .list-head p{margin:0;font-size:12px;color:var(--on-accent-dim);}
  .list-body{flex:1;overflow-y:auto;padding:10px;}

  .filter-bar{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;}
  .filter-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin-right:2px;min-width:50px;}
  .filter-chip{
    font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink-dim);cursor:pointer;white-space:nowrap;
  }
  .filter-chip:hover{border-color:var(--floodlight);}
  .filter-chip.active{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}

  .filter-toggle-btn{
    display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
    color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;
  }
  .filter-toggle-btn:hover{border-color:var(--floodlight);}
  .filter-badge{
    background:var(--floodlight);color:#fff;font-size:11px;font-weight:700;
    border-radius:999px;padding:1px 7px;
  }
  .filter-caret{font-size:10px;color:var(--ink-dim);}
  .filter-panel{margin-top:10px;}
  .filter-clear{
    display:block;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--occupe);
    background:none;border:none;cursor:pointer;padding:0;
  }
  .filter-clear:hover{text-decoration:underline;}

  .map-filter-btn{display:none;}
  .map-filter-overlay{display:none;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(20,40,25,.05);
  }
  .card:hover{border-color:var(--floodlight);box-shadow:var(--shadow);}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .card-name{font-weight:600;font-size:14.5px;color:var(--ink);}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.03em;
    padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
    display:flex;align-items:center;gap:5px;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .card-meta{font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:8px;}

  .s-libre{color:var(--libre);} .s-libre-dot{background:var(--libre);}
  .s-occupe{color:var(--occupe);} .s-occupe-dot{background:var(--occupe);}
  .s-bientot{color:var(--bientot);} .s-bientot-dot{background:var(--bientot);}
  .s-signale{color:var(--signale);} .s-signale-dot{background:var(--signale);}
  .status-pill.s-libre{background:rgba(47,158,92,.12);}
  .status-pill.s-occupe{background:rgba(217,72,58,.12);}
  .status-pill.s-bientot{background:rgba(222,138,37,.14);}
  .status-pill.s-signale{background:rgba(61,127,196,.12);}

  /* ---------- Marqueurs Leaflet ---------- */
  .pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(0,0,0,.30);box-shadow:0 2px 5px rgba(0,0,0,.30);}
  .pin.s-libre{background:var(--libre);}
  .pin.s-occupe{background:var(--occupe);}
  .pin.s-bientot{background:var(--bientot);}
  .pin.s-signale{background:var(--signale);}
  .pin-fresh::after{
    content:'';position:absolute;top:-4px;left:-4px;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--floodlight);animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.6);opacity:1;}100%{transform:scale(1.6);opacity:0;}}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:var(--radius);}
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:12px 14px;min-width:190px;}
  .pop-name{font-family:'Teko',sans-serif;font-size:20px;font-weight:600;text-transform:uppercase;margin-bottom:2px;line-height:1.05;}
  .pop-status{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin:6px 0 10px;}
  .btn-detail{
    display:block;width:100%;text-align:center;font-size:12.5px;font-weight:600;
    padding:7px 10px;border-radius:6px;background:var(--floodlight);color:#fff;border:none;cursor:pointer;
  }

  /* ---------- Panneau détail (dans la sidebar) ---------- */
  .detail{padding:12px 14px;overflow-y:auto;flex:1;}
  .back-btn{
    background:none;border:none;color:var(--ink-dim);font-size:12.5px;font-weight:600;
    cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:4px;
  }
  .back-btn:hover{color:var(--floodlight);}
  .detail-img{width:100%;height:100px;object-fit:cover;border-radius:var(--radius);margin-bottom:10px;background:var(--bg);}
  .detail-name{font-family:'Teko',sans-serif;font-size:24px;font-weight:600;text-transform:uppercase;line-height:1.05;margin-bottom:6px;}
  .detail-status{
    display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
    padding:7px 11px;border-radius:8px;margin-bottom:10px;
  }
  .detail-status.s-libre{background:rgba(47,158,92,.10);}
  .detail-status.s-occupe{background:rgba(217,72,58,.10);}
  .detail-status.s-bientot{background:rgba(222,138,37,.12);}
  .detail-status.s-signale{background:rgba(61,127,196,.10);}
  .detail-status .status-dot{width:10px;height:10px;}

  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .tag{
    font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;
    background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap;
  }

  .email-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;}
  .email-row .email-text{flex:1;color:var(--ink);word-break:break-all;}
  .copy-btn{
    font-size:11px;font-weight:600;padding:5px 9px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;flex-shrink:0;
  }
  .copy-btn:hover{border-color:var(--floodlight);color:var(--floodlight);}
  .copy-btn.copied{border-color:var(--libre);color:var(--libre);}

  .notes-toggle{font-size:11.5px;color:var(--floodlight);cursor:pointer;font-weight:600;margin-top:4px;display:inline-block;}

  .timeline{
    margin:10px 0;padding-left:10px;border-left:3px solid var(--line);
  }
  .timeline h3{
    font-family:'Teko',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.03em;
    margin:0 0 6px;color:var(--ink);
  }
  .timeline-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;color:var(--ink);}
  .timeline-row .status-dot{width:7px;height:7px;}
  .timeline-row .hrs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);min-width:74px;}
  .timeline-empty{font-size:12px;color:var(--ink-dim);}

  .section{margin:10px 0;padding-top:10px;border-top:1px solid var(--line);}
  .section h3{
    font-family:'Teko',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px;
  }
  .row{display:flex;gap:8px;margin-bottom:8px;}
  .row label{font-size:11.5px;color:var(--ink-dim);display:block;margin-bottom:3px;}
  input[type=number], select{
    width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);
    color:var(--ink);font-size:13px;
  }
  .btn{
    font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;width:100%;
  }
  .btn:hover{border-color:var(--floodlight);color:var(--floodlight);}
  .btn.primary{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}
  .btn.primary:hover{opacity:.92;color:#fff;}
  .btn.danger{border-color:var(--occupe);color:var(--occupe);}
  .form-msg{font-size:12px;margin-top:6px;}
  .form-msg.error{color:var(--occupe);}
  .form-msg.ok{color:var(--libre);}

  .live-badge{
    font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }

  .notes-box{font-size:12px;color:var(--ink-dim);line-height:1.5;margin-top:6px;}
  .updated-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-top:14px;}
  .reserve-link{
    display:block;text-align:center;margin-top:10px;padding:9px 12px;border-radius:6px;
    background:var(--accent-dark);color:var(--on-accent);text-decoration:none;font-size:12.5px;font-weight:600;
  }
  .reserve-link:hover{background:var(--accent-dark-2);}

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    position:absolute;bottom:16px;left:16px;z-index:15;
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent-dark);
    border-radius:var(--radius);padding:10px 12px;display:flex;gap:14px;box-shadow:var(--shadow);
  }
  .sb-item{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);}
  .sb-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

  #loadError{display:none;background:var(--occupe);color:#fff;font-size:12.5px;padding:8px 22px;font-family:'IBM Plex Mono',monospace;}

  .mobile-tabs{display:none;}
  .mobile-sport-select{display:none;}

  @media (max-width:820px){
    .filters{display:none;}
    .mobile-sport-select{
      display:block; margin:10px 22px 0; width:calc(100% - 44px); box-sizing:border-box;
      padding:9px 10px; border-radius:8px;
      border:1px solid var(--line); background:var(--panel); color:var(--ink); font-weight:600; font-size:13px;
    }
    .mobile-tabs{
      display:flex; gap:8px; padding:10px 22px; background:var(--bg); border-bottom:1px solid var(--line);
    }
    .mobile-tabs button{
      flex:1; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
      color:var(--ink-dim); font-weight:600; font-size:13px; cursor:pointer;
    }
    .mobile-tabs button.active{background:var(--floodlight); color:#fff; border-color:var(--floodlight);}

    #map.mobile-hidden{display:none;}
    aside.list{display:none;}
    aside.list.mobile-open{display:flex; width:100%; flex:1;}

    .map-filter-btn{
      display:flex; align-items:center; gap:6px;
      position:fixed; right:14px; bottom:16px; z-index:900;
      background:var(--accent-dark); color:var(--on-accent); border:none; border-radius:999px;
      padding:11px 18px; font-weight:600; font-size:13px; cursor:pointer; box-shadow:var(--shadow);
    }
    .map-filter-overlay{
      display:none; position:fixed; left:14px; right:14px; bottom:70px; z-index:900;
      background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
      padding:14px; box-shadow:var(--shadow); max-height:55vh; overflow-y:auto;
    }
    .map-filter-overlay.open{display:block;}
    .scoreboard{left:8px;bottom:8px;padding:8px 10px;gap:10px;flex-wrap:wrap;max-width:210px;}
    .top-meta{display:none;}
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="wordmark">
      <span class="dot"></span>
      <h1>Stadio</h1>
      <span class="tag">terrains de soccer de Montréal, en direct</span>
    </div>
    <div class="top-meta">mise à jour <b id="clock">--:--</b> · <span id="counter">-- terrains suivis</span></div>
  </header>

  <div id="loadError"></div>

  <div class="filters" id="filters"></div>
  <select class="mobile-sport-select" id="mobileSportSelect" onchange="setSport(this.value)"></select>
  <div class="mobile-tabs">
    <button id="tabMap" class="active" onclick="setMobileTab('map')">Carte</button>
    <button id="tabList" onclick="setMobileTab('list')">Liste</button>
  </div>

  <main class="split">
    <div id="map"></div>
    <aside class="list" id="sidebar"></aside>
  </main>

  <div class="scoreboard" id="scoreboard"></div>

  <button id="mapFilterBtn" class="map-filter-btn" onclick="toggleFilterPanel()">
    Filtrer <span id="mapFilterBadge" class="filter-badge" style="display:none;"></span>
  </button>
  <div id="mapFilterOverlay" class="map-filter-overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* =====================================================================
   CONFIG / DONNÉES
   ===================================================================== */
const SPORTS = [
  {id:'soccer', label:'Soccer', enabled:true},
  {id:'tennis', label:'Tennis', enabled:false},
  {id:'patinoire', label:'Patinoires', enabled:false},
  {id:'piscine', label:'Piscines', enabled:false},
];

const STATUS_LABEL = {
  libre:'Libre maintenant',
  occupe:'Occupé',
  bientot:'Bientôt occupé',
  signale:'Occupé mais ouvert',
};
const STATUS_LABEL_SHORT = {libre:'Libre', occupe:'Occupé', bientot:'Bientôt occupé', signale:'Ouvert'};

let TERRAINS = [];

async function loadTerrainsFromCSV(){
  const statusEl = document.getElementById('loadError');
  try{
    const res = await fetch('terrains.csv?t=' + Date.now());
    if(!res.ok) throw new Error('terrains.csv introuvable (' + res.status + ')');
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, dynamicTyping:true, skipEmptyLines:true});
    TERRAINS = parsed.data
      .filter(row => row.id)
      .map(row => ({
        id: String(row.id),
        name: row.name,
        addr: row.addr,
        lat: row.lat,
        lng: row.lng,
        sport: row.sport || 'soccer',
        format: row.format || '',
        capacity: Number(row.capacity) || 0,
        surface: row.surface || '',
        access: row.access || '',
        montrealUrl: row.montrealUrl || '',
        reserveUrl: row.reserveUrl || '',
        embedUrl: row.embed_url || '',
        photoUrl: row.photo_url || '',
        base: row.status || 'libre',
        reservedSlots: parseSlots(row.reserved_slots),
        notes: row.notes || '',
      }));
    TERRAINS.forEach(t=>{
      t.formatTags = (t.format||'').split(',').map(s=>s.trim()).filter(Boolean);
      t.surfaceTag = t.surface || '';
      t.accessTag = t.access || '';
    });
    buildFilterGroups();
    if(statusEl) statusEl.style.display = 'none';
  }catch(e){
    console.error('Échec du chargement de terrains.csv :', e);
    if(statusEl){
      statusEl.style.display = 'block';
      statusEl.textContent = 'terrains.csv n\'a pas pu être chargé — vérifie qu\'il est bien dans le même dossier que ce fichier.';
    }
  }
}

/* =====================================================================
   CRÉNEAUX DE LA BASE DE DONNÉES (colonne reserved_slots)
   Format d'un créneau : Jours,HeureDébut,HeureFin,DateDébut,DateFin,Statut,Étiquette
   Jours en abrégé FR (Lun..Dim), plage avec "-", liste avec "+"
   Statut ∈ {libre, occupe, signale} — "bientot" est calculé, jamais stocké
   ===================================================================== */
const DAY_ORDER = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function jsDayToOrder(jsDay){ return jsDay === 0 ? 6 : jsDay - 1; }

function parseSlots(raw){
  if(!raw || typeof raw !== 'string') return [];
  return raw.split('|').map(chunk=>{
    const parts = chunk.split(',').map(s=>s.trim());
    if(parts.length < 7) return null;
    const [days, start, end, dateStart, dateEnd, status, label] = parts;
    return {days, start, end, dateStart: dateStart||null, dateEnd: dateEnd||null, status: status||'occupe', label: label||''};
  }).filter(Boolean);
}

function dayMatches(daysField, todayIdx){
  return daysField.split('+').map(s=>s.trim()).some(p=>{
    if(p.includes('-')){
      const [a,b] = p.split('-').map(s=>DAY_ORDER.indexOf(s.trim()));
      if(a===-1||b===-1) return false;
      return a<=b ? (todayIdx>=a && todayIdx<=b) : (todayIdx>=a || todayIdx<=b);
    }
    return DAY_ORDER.indexOf(p) === todayIdx;
  });
}
function dateInRange(dateStart, dateEnd, todayStr){
  if(dateStart && todayStr < dateStart) return false;
  if(dateEnd && todayStr > dateEnd) return false;
  return true;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function toMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function fmtMin(min){ const h = Math.floor(min/60), m = min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

// tous les créneaux DB actifs aujourd'hui (peu importe l'heure), triés
function todaysDbSlots(t){
  const ds = todayStr();
  const idx = jsDayToOrder(new Date().getDay());
  return (t.reservedSlots||[])
    .filter(s => dayMatches(s.days, idx) && dateInRange(s.dateStart, s.dateEnd, ds))
    .map(s => ({start:toMin(s.start), end:toMin(s.end), status:s.status, label:s.label, source:'db'}))
    .sort((a,b)=>a.start-b.start);
}

/* =====================================================================
   STOCKAGE COMMUNAUTAIRE (partagé) — réservations (couvre aussi
   l'occupation immédiate : il suffit de réserver à partir de "maintenant")
   ===================================================================== */
/* =====================================================================
   STOCKAGE — utilise window.storage (aperçu Claude, partagé entre
   appareils) quand disponible ; sinon bascule automatiquement sur
   localStorage (fonctionne une fois le site déployé, mais reste propre
   à cet appareil/navigateur — pas de partage entre joueurs dans ce cas).
   ===================================================================== */

/* =====================================================================
   CALCUL DU STATUT EFFECTIF — purement une traduction UX de ce que la
   base de données indique (elle-même reprise du site de la Ville).
   Stadio n'invente ni ne modifie aucun statut : "bientôt occupé" (orange)
   est juste un calcul dérivé d'un créneau "occupé" qui arrive dans les
   30 prochaines minutes.
   ===================================================================== */
function effectiveStatus(t){
  const nm = nowMin();

  const dbSlot = todaysDbSlots(t).find(s => s.start <= nm && nm < s.end);
  let status, note;
  if(dbSlot){
    status = dbSlot.status;
    note = `${dbSlot.label} jusqu'à ${fmtMin(dbSlot.end)}`;
  }else{
    status = t.base || 'libre';
    note = '';
  }

  if(status === 'libre'){
    const upcoming = todaysDbSlots(t).filter(s => s.status==='occupe' && s.start > nm && s.start - nm <= 30);
    if(upcoming.length){
      return {status:'bientot', source:'upcoming', note:`Occupé dans ${upcoming[0].start-nm} min — ${upcoming[0].label}`};
    }
  }
  return {status, source:'db', note};
}

function timeAgo(ts){
  const min = Math.round((Date.now()-ts)/60000);
  if(min < 1) return 'à l\'instant';
  if(min === 1) return 'il y a 1 min';
  if(min < 60) return `il y a ${min} min`;
  return `il y a ${Math.round(min/60)} h`;
}

/* =====================================================================
   CARTE
   ===================================================================== */
/* =====================================================================
   LOCALISATION — pour trier les fiches par proximité. Best-effort : si
   l'utilisateur refuse ou que la géoloc échoue, on garde l'ordre du CSV.
   ===================================================================== */
let userPos = null;
function requestGeolocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => { userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude}; resolve(userPos); },
      ()  => resolve(null),
      {enableHighAccuracy:false, timeout:8000, maximumAge:5*60*1000}
    );
  });
}
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad = x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function sortByDistance(list){
  if(!userPos) return list.map(t=>({t, dist:null}));
  return list.map(t=>({t, dist:haversineKm(userPos.lat,userPos.lng,t.lat,t.lng)}))
             .sort((a,b)=>a.dist-b.dist);
}
function fmtDist(km){
  if(km==null) return '';
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
}

const map = L.map('map', {zoomControl:false}).setView([45.5301, -73.6000], 12);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution:'Tiles &copy; Esri — Source: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), © OpenStreetMap contributors, GIS User Community',
  maxZoom:19,
}).addTo(map);

let mapUserMoved = false;
let isProgrammaticMove = false;
map.on('movestart', ()=>{ if(!isProgrammaticMove) mapUserMoved = true; });

let markers = {};
let activeSport = 'soccer';
let selectedId = null;

/* =====================================================================
   FILTRES PAR TAGS — Format, Surface, Accès. Une case cochée dans une
   catégorie filtre en OU au sein de la catégorie, en ET entre catégories.
   ===================================================================== */
let FILTER_GROUPS = [];
let activeFilters = {format:new Set(), surface:new Set(), access:new Set()};

function buildFilterGroups(){
  const formats = new Set(), surfaces = new Set(), access = new Set();
  TERRAINS.forEach(t=>{
    (t.formatTags||[]).forEach(f=>formats.add(f));
    if(t.surfaceTag) surfaces.add(t.surfaceTag);
    if(t.accessTag) access.add(t.accessTag);
  });
  FILTER_GROUPS = [
    {key:'format', label:'Format', values:[...formats].sort()},
    {key:'surface', label:'Surface', values:[...surfaces].sort()},
    {key:'access', label:'Accès', values:[...access].sort()},
  ];
}

function terrainMatchesFilters(t){
  return FILTER_GROUPS.every(g=>{
    const sel = activeFilters[g.key];
    if(!sel || sel.size===0) return true;
    if(g.key==='format') return (t.formatTags||[]).some(f=>sel.has(f));
    if(g.key==='surface') return sel.has(t.surfaceTag);
    if(g.key==='access') return sel.has(t.accessTag);
    return true;
  });
}
function activeFilterCount(){
  return Object.values(activeFilters).reduce((sum,set)=>sum+set.size, 0);
}

let filterPanelOpen = false;

function renderFilterPanelContent(){
  return FILTER_GROUPS.map(g=>`
    <div class="filter-group">
      <span class="filter-group-label">${g.label}</span>
      ${g.values.map(v=>{
        const active = activeFilters[g.key].has(v);
        return `<span class="filter-chip ${active?'active':''}" onclick="toggleFilter('${g.key}', '${v.replace(/'/g,"\\'")}')">${v}</span>`;
      }).join('')}
    </div>
  `).join('');
}

// synchronise les deux emplacements possibles du panneau de filtres (liste desktop/mobile, et bouton flottant sur la carte mobile)
function syncFilterUI(){
  showList();
  const overlay = document.getElementById('mapFilterOverlay');
  if(overlay){
    const count = activeFilterCount();
    overlay.innerHTML = renderFilterPanelContent() + (count>0 ? `<button class="filter-clear" onclick="clearFilters()">Réinitialiser les filtres</button>` : '');
  }
  const badge = document.getElementById('mapFilterBadge');
  if(badge){
    const count = activeFilterCount();
    badge.textContent = count;
    badge.style.display = count>0 ? 'inline-block' : 'none';
  }
  applyMobileView();
}

window.toggleFilter = function(key, val){
  const set = activeFilters[key];
  if(set.has(val)) set.delete(val); else set.add(val);
  mapUserMoved = false; // un changement de filtre doit recadrer sur les terrains concernés
  syncFilterUI();
  render();
};
window.clearFilters = function(){
  Object.values(activeFilters).forEach(s=>s.clear());
  mapUserMoved = false;
  syncFilterUI();
  render();
};
window.toggleFilterPanel = function(){
  filterPanelOpen = !filterPanelOpen;
  syncFilterUI();
};

// vue mobile : 'map' | 'list' | 'detail' — sur desktop ces classes n'ont aucun effet (voir CSS)
let mobileView = 'map';
let mobileLastView = 'map';
function applyMobileView(){
  const sidebar = document.getElementById('sidebar');
  const mapEl = document.getElementById('map');
  const showSidebar = (mobileView === 'list' || mobileView === 'detail');
  sidebar.classList.toggle('mobile-open', showSidebar);
  mapEl.classList.toggle('mobile-hidden', showSidebar);
  const tabMap = document.getElementById('tabMap');
  const tabList = document.getElementById('tabList');
  if(tabMap) tabMap.classList.toggle('active', mobileView==='map');
  if(tabList) tabList.classList.toggle('active', mobileView==='list');
  if(!showSidebar) setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 50); // la carte redevient visible : recalcule sa taille

  // bouton flottant "Filtrer" : uniquement utile sur la vue carte mobile (ailleurs, les filtres sont déjà dans la liste)
  const filterBtn = document.getElementById('mapFilterBtn');
  if(filterBtn) filterBtn.style.display = (mobileView==='map') ? '' : 'none';
  const overlay = document.getElementById('mapFilterOverlay');
  if(overlay) overlay.classList.toggle('open', filterPanelOpen && mobileView==='map');
}
window.setMobileTab = function(view){
  mobileView = view;
  mobileLastView = view;
  selectedId = null;
  if(view==='list') showList();
  applyMobileView();
};
function goBackFromDetail(){
  selectedId = null;
  mobileView = mobileLastView; // revient à l'onglet actif avant l'ouverture de la fiche (carte ou liste, sans effet sur desktop)
  showList();
  applyMobileView();
}
window.goBackFromDetail = goBackFromDetail;

function pinIcon(status, fresh){
  return L.divIcon({
    className:'',
    html:`<div class="pin s-${status} ${fresh?'pin-fresh':''}" style="position:relative;"></div>`,
    iconSize:[22,22], iconAnchor:[11,20], popupAnchor:[0,-18],
  });
}

function openMiniPopup(t){
  const eff = effectiveStatus(t);
  const m = markers[t.id];
  if(!m) return;
  const imgHtml = t.photoUrl ? `<img src="${t.photoUrl}" alt="${t.name}" style="width:100%;height:80px;object-fit:cover;border-radius:6px;margin-bottom:8px;" onerror="this.remove()">` : '';
  m.setPopupContent(`
    ${imgHtml}
    <div class="pop-name">${t.name}</div>
    <div class="pop-status s-${eff.status}"><span class="status-dot s-${eff.status}-dot" style="display:inline-block;"></span>${STATUS_LABEL[eff.status]}</div>
    <button class="btn-detail" onclick="selectTerrain('${t.id}')">Voir la fiche</button>
  `);
  m.openPopup();
}

/* =====================================================================
   PANNEAU DÉTAIL
   ===================================================================== */
function renderTimeline(t){
  const rows = todaysDbSlots(t);
  if(!rows.length) return `<div class="timeline-empty">Aucun horaire particulier aujourd'hui — terrain libre selon disponibilité.</div>`;
  const nm = nowMin();
  return rows.map(s=>{
    const active = nm >= s.start && nm < s.end;
    return `<div class="timeline-row" style="${active?'font-weight:600;':''}">
      <span class="status-dot s-${s.status}-dot"></span>
      <span class="hrs">${fmtMin(s.start)}–${fmtMin(s.end)}</span> ${s.label}
    </div>`;
  }).join('');
}

function copyEmail(email, btn){
  const done = ()=>{
    btn.textContent = 'Copié';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(email).then(done).catch(()=>fallbackCopy(email, done));
  }else{
    fallbackCopy(email, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}
window.copyEmail = copyEmail;

function renderReservationRow(t){
  if(!t.reserveUrl) return '';
  let inner;
  if(t.reserveUrl.startsWith('mailto:')){
    const email = t.reserveUrl.replace('mailto:','');
    inner = `<div class="email-row"><span class="email-text">${email}</span><button class="copy-btn" onclick="copyEmail('${email}', this)">Copier</button></div>`;
  }else if(t.reserveUrl.startsWith('tel:')){
    const digits = t.reserveUrl.replace('tel:+1','');
    const phone = digits.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
    inner = `<a class="reserve-link" href="${t.reserveUrl}">Appeler — ${phone}</a>`;
  }else{
    inner = `<a class="reserve-link" href="${t.reserveUrl}" target="_blank" rel="noopener">Réservation officielle / infos</a>`;
  }
  return `<div class="section"><h3>Réserver</h3>${inner}</div>`;
}
function renderMontrealLink(t){
  if(!t.montrealUrl) return '';
  return `<a class="reserve-link" style="background:var(--panel);border:1px solid var(--line);color:var(--ink);margin-top:8px;" href="${t.montrealUrl}" target="_blank" rel="noopener">Voir la fiche officielle Montréal.ca</a>`;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function linkify(text){
  return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener" style="color:var(--floodlight);word-break:break-all;">${url}</a>`
  );
}

function openDetail(id){
  selectedId = id;
  const t = TERRAINS.find(x=>x.id===id);
  if(!t) return;
  if(mobileView !== 'detail') mobileLastView = mobileView; // se souvenir d'où revenir
  mobileView = 'detail';
  const eff = effectiveStatus(t);

  const imgHtml = t.photoUrl ? `<img class="detail-img" src="${t.photoUrl}" alt="${t.name}" onerror="this.style.display='none'">` : '';

  const tags = [...(t.formatTags||[])];
  if(t.surfaceTag) tags.push(t.surfaceTag);
  if(t.accessTag) tags.push(t.accessTag);
  const tagsHtml = `<div class="tag-row">${tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`;

  let notesHtml = '';
  if(t.notes){
    const short = t.notes.length > 90 ? t.notes.slice(0,90) + '…' : t.notes;
    notesHtml = t.notes.length > 90
      ? `<div class="notes-box" id="notesShort-${t.id}">${escapeHtml(short)} <span class="notes-toggle" onclick="document.getElementById('notesShort-${t.id}').style.display='none';document.getElementById('notesFull-${t.id}').style.display='block';">Voir plus</span></div>
         <div class="notes-box" id="notesFull-${t.id}" style="display:none;">${linkify(t.notes)}</div>`
      : `<div class="notes-box">${linkify(t.notes)}</div>`;
  }

  document.getElementById('sidebar').innerHTML = `
    <div class="detail">
      <button class="back-btn" onclick="goBackFromDetail()">← Retour</button>
      ${imgHtml}
      <div class="detail-name">${t.name}</div>
      <div class="detail-status s-${eff.status}">
        <span class="status-dot s-${eff.status}-dot"></span>
        ${STATUS_LABEL[eff.status]}${eff.note ? ' — ' + eff.note : ''}
      </div>

      ${tagsHtml}

      <div class="timeline">
        <h3>Planning du jour</h3>
        ${renderTimeline(t)}
      </div>

      ${renderReservationRow(t)}
      ${renderMontrealLink(t)}

      ${notesHtml ? `<div class="section"><h3>Détails</h3>${notesHtml}</div>` : ''}
    </div>
  `;
  applyMobileView();
  const mapVisible = !document.getElementById('map').classList.contains('mobile-hidden');
  if(mapVisible){
    isProgrammaticMove = true;
    map.setView([t.lat, t.lng], 15);
    isProgrammaticMove = false;
    openMiniPopup(t);
  }
}
window.openDetail = openDetail;
window.selectTerrain = (id)=>{ openDetail(id); };

/* =====================================================================
   LISTE (panneau par défaut)
   ===================================================================== */
function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = SPORTS.map(s=>`
    <div class="chip ${s.id===activeSport?'active':''} ${!s.enabled?'disabled':''}"
         onclick="${s.enabled ? `setSport('${s.id}')` : ''}">
      ${s.label}${!s.enabled?' · bientôt':''}
    </div>
  `).join('');

  const sel = document.getElementById('mobileSportSelect');
  if(sel){
    sel.innerHTML = SPORTS.map(s=>`
      <option value="${s.id}" ${s.id===activeSport?'selected':''} ${!s.enabled?'disabled':''}>${s.label}${!s.enabled?' (bientôt)':''}</option>
    `).join('');
  }
}
window.setSport = (id)=>{ activeSport = id; selectedId = null; showList(); applyMobileView(); render(); };

function currentList(){
  const list = TERRAINS.filter(t=>t.sport===activeSport && terrainMatchesFilters(t));
  if(!userPos) return list;
  return sortByDistance(list).map(x=>x.t);
}

function showList(){
  selectedId = null;
  const list = currentList();
  const count = activeFilterCount();
  document.getElementById('sidebar').innerHTML = `
    <div class="list-head">
      <h2>Terrains — ${SPORTS.find(s=>s.id===activeSport).label}</h2>
      <p>Cliquer un terrain pour voir sa fiche.</p>
    </div>
    <div class="filter-bar">
      <button class="filter-toggle-btn" onclick="toggleFilterPanel()">
        <span>Filtrer les terrains${count>0?` <span class="filter-badge">${count}</span>`:''}</span>
        <span class="filter-caret">${filterPanelOpen?'▲':'▼'}</span>
      </button>
      ${filterPanelOpen ? `<div class="filter-panel">${renderFilterPanelContent()}${count>0?'<button class="filter-clear" onclick="clearFilters()">Réinitialiser les filtres</button>':''}</div>` : ''}
    </div>
    <div class="list-body" id="listBody"></div>
  `;
  renderListBody(list);
}
window.showList = showList;

function renderListBody(list){
  const body = document.getElementById('listBody');
  if(!body) return;
  body.innerHTML = list.map(t=>{
    const eff = effectiveStatus(t);
    const d = userPos ? haversineKm(userPos.lat, userPos.lng, t.lat, t.lng) : null;
    return `
      <div class="card" onclick="selectTerrain('${t.id}')">
        <div class="card-top">
          <div class="card-name">${t.name}</div>
          <div class="status-pill s-${eff.status}"><span class="status-dot s-${eff.status}-dot"></span>${STATUS_LABEL_SHORT[eff.status]}</div>
        </div>
        <div class="card-meta">
          <span>${t.addr}</span>
          ${d!==null ? `<span>${fmtDist(d)}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderScoreboard(list){
  const counts = {libre:0, occupe:0, bientot:0, signale:0};
  list.forEach(t=>{ counts[effectiveStatus(t).status]++; });
  document.getElementById('scoreboard').innerHTML = `
    <div class="sb-item"><span class="sb-dot s-libre-dot"></span>Libre — ${counts.libre}</div>
    <div class="sb-item"><span class="sb-dot s-bientot-dot"></span>Bientôt — ${counts.bientot}</div>
    <div class="sb-item"><span class="sb-dot s-occupe-dot"></span>Occupé — ${counts.occupe}</div>
    <div class="sb-item"><span class="sb-dot s-signale-dot"></span>Ouvert — ${counts.signale}</div>
  `;
}

function render(){
  const list = currentList();
  renderFilters();
  document.getElementById('counter').textContent = `${list.length} terrains suivis`;
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
  renderScoreboard(list);

  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};
  list.forEach(t=>{
    const eff = effectiveStatus(t);
    const fresh = false;
    const m = L.marker([t.lat,t.lng], {icon: pinIcon(eff.status, fresh)}).addTo(map);
    m.bindPopup('', {closeButton:true, offset:[0,-4]});
    m.on('click', ()=> openMiniPopup(t));
    markers[t.id] = m;
  });

  if(!mapUserMoved && list.length){
    isProgrammaticMove = true;
    map.fitBounds(L.latLngBounds(list.map(t=>[t.lat,t.lng])), {padding:[50,50], maxZoom:14});
    isProgrammaticMove = false;
  }

  if(selectedId){
    openDetail(selectedId);
  }else{
    renderListBody(list);
  }
}

(async function start(){
  await loadTerrainsFromCSV();
  showList();
  applyMobileView();
  requestGeolocation().then(()=> render()); // re-tri dès que la position est connue
  render();
})();
setInterval(render, 30000);
setInterval(loadTerrainsFromCSV, 5*60*1000);
</script>
