<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadio — Terrains de sport à Montréal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --turf-dark:#F4F5F1;
    --turf-mid:#FFFFFF;
    --turf-line:#DDE1D6;
    --chalk:#16241A;
    --chalk-dim:#6B7568;
    --ink:#0E1F16;
    --floodlight:#2F7D4F;
    --floodlight-dim:#BFE0CC;
    --libre:#2F9E5C;
    --occupe:#D9483A;
    --priorite:#DB9A25;
    --signale:#3D7FC4;
    --radius:10px;
    --shadow:0 6px 18px rgba(20,40,25,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--turf-dark);color:var(--chalk);font-family:'IBM Plex Sans',sans-serif;overflow:hidden;}
  ::selection{background:var(--floodlight);color:#fff;}

  /* ---------- Layout shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--turf-line);
    background:linear-gradient(180deg,var(--turf-mid),var(--turf-dark));
    flex-shrink:0;z-index:20;
  }
  .wordmark{display:flex;align-items:baseline;gap:10px;}
  .wordmark .dot{width:10px;height:10px;border-radius:50%;background:var(--libre);box-shadow:0 0 0 3px rgba(47,158,92,.20);flex-shrink:0;align-self:center;}
  .wordmark h1{
    font-family:'Teko',sans-serif;font-weight:600;font-size:32px;letter-spacing:.5px;
    margin:0;color:var(--chalk);line-height:1;text-transform:uppercase;
  }
  .wordmark span.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-dim);letter-spacing:.04em;}
  .top-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-dim);text-align:right;}
  .top-meta b{color:var(--floodlight);font-weight:500;}

  /* ---------- Filter bar ---------- */
  .filters{
    display:flex;gap:8px;padding:10px 22px;background:var(--turf-dark);
    border-bottom:1px solid var(--turf-line);overflow-x:auto;flex-shrink:0;
  }
  .chip{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;
    padding:7px 14px;border-radius:999px;border:1px solid var(--turf-line);
    background:var(--turf-mid);color:var(--chalk-dim);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .chip:hover{border-color:var(--floodlight-dim);}
  .chip.active{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}
  .chip.disabled{opacity:.4;cursor:not-allowed;}
  .chip.disabled:hover{border-color:var(--turf-line);}

  /* ---------- Main split ---------- */
  main.split{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;background:#E7EAE1;}
  aside.list{
    width:380px;flex-shrink:0;border-left:1px solid var(--turf-line);
    background:var(--turf-mid);display:flex;flex-direction:column;min-height:0;
  }
  .list-head{
    padding:14px 18px 10px;border-bottom:1px solid var(--turf-line);flex-shrink:0;
  }
  .list-head h2{
    font-family:'Teko',sans-serif;font-weight:600;font-size:20px;margin:0 0 2px;
    text-transform:uppercase;letter-spacing:.03em;color:var(--chalk);
  }
  .list-head p{margin:0;font-size:12px;color:var(--chalk-dim);}
  .list-body{flex:1;overflow-y:auto;padding:8px;}

  .card{
    background:var(--turf-mid);border:1px solid var(--turf-line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(20,40,25,.04);
  }
  .card:hover{border-color:var(--floodlight-dim);box-shadow:var(--shadow);}
  .card.selected{border-color:var(--floodlight);background:#F3FAF5;}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .card-name{font-weight:600;font-size:14.5px;color:var(--chalk);}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.03em;
    padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
  }
  .card-meta{font-size:12px;color:var(--chalk-dim);display:flex;justify-content:space-between;}

  /* status colors */
  .s-libre{color:var(--libre);}
  .s-occupe{color:var(--occupe);}
  .s-priorite{color:var(--priorite);}
  .s-signale{color:var(--signale);}
  .status-pill.s-libre{background:rgba(47,158,92,.12);color:var(--libre);}
  .status-pill.s-occupe{background:rgba(217,72,58,.12);color:var(--occupe);}
  .status-pill.s-priorite{background:rgba(219,154,37,.14);color:var(--priorite);}
  .status-pill.s-signale{background:rgba(61,127,196,.12);color:var(--signale);}

  /* ---------- Leaflet marker ---------- */
  .pin{
    width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 5px rgba(0,0,0,.4);
  }
  .pin.s-libre{background:var(--libre);}
  .pin.s-occupe{background:var(--occupe);}
  .pin.s-priorite{background:var(--priorite);}
  .pin.s-signale{background:var(--signale);}
  .pin-fresh::after{
    content:'';position:absolute;top:-4px;left:-4px;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--floodlight);animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.6);opacity:1;}100%{transform:scale(1.6);opacity:0;}}

  /* ---------- Leaflet popup theming ---------- */
  .leaflet-popup-content-wrapper{background:var(--turf-mid);color:var(--chalk);border-radius:var(--radius);}
  .leaflet-popup-tip{background:var(--turf-mid);}
  .leaflet-popup-content{margin:12px 14px;font-family:'IBM Plex Sans',sans-serif;min-width:240px;}
  .pop-name{font-family:'Teko',sans-serif;font-size:22px;font-weight:600;text-transform:uppercase;margin-bottom:2px;}
  .pop-addr{font-size:12px;color:var(--chalk-dim);margin-bottom:8px;}
  .pop-status{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:10px;}
  .pop-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .btn-report{
    font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:600;
    padding:6px 10px;border-radius:6px;border:1px solid var(--turf-line);
    background:var(--turf-dark);color:var(--chalk);cursor:pointer;
  }
  .btn-report:hover{border-color:var(--floodlight);color:var(--floodlight);}
  .btn-reserve{
    display:inline-block;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;
    padding:8px 12px;border-radius:6px;background:var(--floodlight);color:#fff;
    text-decoration:none;text-align:center;width:100%;
  }
  .pop-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--chalk-dim);margin-top:8px;}
  .pop-img{
    width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:10px;
    background:var(--turf-dark);display:block;
  }
  .pop-img-wrap{position:relative;}
  .pop-img-tag{
    position:absolute;bottom:6px;right:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;
    background:rgba(14,31,22,.55);color:#fff;padding:2px 6px;border-radius:4px;letter-spacing:.03em;
  }

  /* ---------- Legend (scoreboard) ---------- */
  .scoreboard{
    position:absolute;bottom:16px;left:16px;z-index:15;
    background:var(--turf-mid);border:1px solid var(--turf-line);border-radius:var(--radius);
    padding:10px 12px;display:flex;gap:14px;box-shadow:var(--shadow);
  }
  .sb-item{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-dim);}
  .sb-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .sb-dot.s-libre{background:var(--libre);}
  .sb-dot.s-priorite{background:var(--priorite);}
  .sb-dot.s-occupe{background:var(--occupe);}
  .sb-dot.s-signale{background:var(--signale);}

  /* ---------- Mobile ---------- */
  .tab-switch{display:none;}
  @media (max-width:820px){
    main.split{flex-direction:column;}
    #map{flex:none;height:48vh;}
    aside.list{width:100%;border-left:none;border-top:1px solid var(--turf-line);flex:1;}
    .scoreboard{left:8px;bottom:8px;padding:8px 10px;gap:10px;flex-wrap:wrap;max-width:200px;}
    .top-meta{display:none;}
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--turf-line);border-radius:4px;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="wordmark">
      <span class="dot"></span>
      <h1>Stadio</h1>
      <span class="tag">terrains de Montréal, en temps réel</span>
    </div>
    <div class="top-meta">mise à jour <b id="clock">--:--</b> · <span id="counter">-- terrains suivis</span></div>
  </header>

  <div id="loadError" style="display:none;background:var(--occupe);color:#fff;font-size:12.5px;padding:8px 22px;font-family:'IBM Plex Mono',monospace;"></div>

  <div class="filters" id="filters"></div>

  <main class="split">
    <div id="map"></div>
    <aside class="list">
      <div class="list-head">
        <h2 id="listTitle">Terrains — Soccer</h2>
        <p id="listSub">Cliquer un terrain pour le centrer sur la carte.</p>
      </div>
      <div class="list-body" id="listBody"></div>
    </aside>
  </main>

  <div class="scoreboard" id="scoreboard"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* =====================================================================
   DONNÉES — v1 : jeu de terrains mock inspiré de vrais parcs montréalais.
   En v2, ce tableau serait remplacé par un fetch des jeux de données
   ouvertes de la Ville (donnees.montreal.ca) + un flux de statut.
   ===================================================================== */
const SPORTS = [
  {id:'soccer', label:'Soccer', enabled:true},
  {id:'tennis', label:'Tennis', enabled:false},
  {id:'patinoire', label:'Patinoires', enabled:false},
  {id:'piscine', label:'Piscines', enabled:false},
];

const STATUS_LABEL = {
  libre:'Libre',
  priorite:'Libre — priorité résa',
  occupe:'Occupé',
  signale:'Signalé occupé — venez quand même',
};

/* Le tableau est maintenant rempli par loadTerrainsFromCSV() au démarrage,
   à partir du fichier terrains.csv placé à côté de ce .html dans le dépôt. */
let TERRAINS = [];

async function loadTerrainsFromCSV(){
  const statusEl = document.getElementById('loadError');
  try{
    // le paramètre ?t= évite que le navigateur/GitHub Pages serve une version en cache du CSV
    const res = await fetch('terrains.csv?t=' + Date.now());
    if(!res.ok) throw new Error('terrains.csv introuvable (' + res.status + ')');
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, dynamicTyping:true, skipEmptyLines:true});
    if(parsed.errors && parsed.errors.length){
      console.warn('Erreurs de parsing CSV :', parsed.errors);
    }
    TERRAINS = parsed.data
      .filter(row => row.id) // ignore les lignes vides/mal formées
      .map(row => ({
        id: String(row.id),
        name: row.name,
        addr: row.addr,
        arrondissement: row.arrondissement || '',
        notes: row.notes || '',
        source: row.source || '',
        lat: row.lat,
        lng: row.lng,
        sport: row.sport,
        base: row.status,
        reserveUrl: row.reserveUrl || 'https://montreal.ca',
        reservedSlots: parseSlots(row.reserved_slots),
        imageUrl: row.image_url || '',
      }));
    if(statusEl) statusEl.style.display = 'none';
  }catch(e){
    console.error('Échec du chargement de terrains.csv :', e);
    if(statusEl){
      statusEl.style.display = 'block';
      statusEl.textContent = 'terrains.csv n\'a pas pu être chargé — vérifie qu\'il est bien dans le même dossier que ce fichier.';
    }
  }
}

/* =====================================================================
   CRÉNEAUX RÉCURRENTS — colonne CSV "reserved_slots".
   Format d'une cellule : plusieurs créneaux séparés par "|", chaque créneau =
   Jours,HeureDébut,HeureFin,DateDébut,DateFin,Statut,Étiquette
   -> Jours en abrégé FR (Lun Mar Mer Jeu Ven Sam Dim), plage avec "-" ou liste avec "+"
   -> DateDébut/DateFin au format AAAA-MM-DD, laisser vide si la plage vaut toute l'année
   -> Statut ∈ {libre, priorite, occupe}
   Exemple : "Mar+Mer+Jeu,16:00,18:00,2026-07-02,2026-11-02,priorite,Priorité jeunes"
   ===================================================================== */
const DAY_ORDER = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function jsDayToOrder(jsDay){ return jsDay === 0 ? 6 : jsDay - 1; } // JS: Dim=0..Sam=6 -> notre ordre Lun=0..Dim=6

function parseSlots(raw){
  if(!raw || typeof raw !== 'string') return [];
  return raw.split('|').map(chunk=>{
    const parts = chunk.split(',').map(s=>s.trim());
    if(parts.length < 7) return null;
    const [days, start, end, dateStart, dateEnd, status, label] = parts;
    return {days, start, end, dateStart: dateStart||null, dateEnd: dateEnd||null, status: status||'occupe', label: label||''};
  }).filter(Boolean);
}

function dayMatches(daysField, todayIdx){
  const parts = daysField.split('+').map(s=>s.trim());
  return parts.some(p=>{
    if(p.includes('-')){
      const [a,b] = p.split('-').map(s=>DAY_ORDER.indexOf(s.trim()));
      if(a===-1||b===-1) return false;
      return a<=b ? (todayIdx>=a && todayIdx<=b) : (todayIdx>=a || todayIdx<=b);
    }
    return DAY_ORDER.indexOf(p) === todayIdx;
  });
}

function dateInRange(dateStart, dateEnd, now){
  if(!dateStart && !dateEnd) return true;
  const todayStr = now.toISOString().slice(0,10);
  if(dateStart && todayStr < dateStart) return false;
  if(dateEnd && todayStr > dateEnd) return false;
  return true;
}

function activeSlotNow(slots){
  if(!slots || !slots.length) return null;
  const now = new Date();
  const todayIdx = jsDayToOrder(now.getDay());
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const s of slots){
    if(!dayMatches(s.days, todayIdx)) continue;
    if(!dateInRange(s.dateStart, s.dateEnd, now)) continue;
    const [sh,sm] = s.start.split(':').map(Number);
    const [eh,em] = s.end.split(':').map(Number);
    const startMin = sh*60+sm, endMin = eh*60+em;
    if(nowMin >= startMin && nowMin < endMin) return {...s, endMin};
  }
  return null;
}


/* =====================================================================
   IMAGE D'APERÇU — si aucune image_url n'est fournie dans le CSV, on
   affiche une vue satellite (tuile Esri World Imagery, gratuite, sans clé)
   centrée approximativement sur le terrain, à défaut d'une vraie photo.
   ===================================================================== */
function lonToTileX(lon, z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function latToTileY(lat, z){
  const rad = lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*Math.pow(2,z));
}
function satImageUrl(lat, lng, z){
  z = z || 17;
  const x = lonToTileX(lng, z), y = latToTileY(lat, z);
  return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
}

const REPORT_TTL_MS = 90 * 60 * 1000;
let reports = {}; // terrainId -> {status, ts, count}
let activeSport = 'soccer';
let selectedId = null;
let markers = {};

async function loadReports(){
  try{
    const res = await window.storage.list('report:', true);
    const keys = (res && res.keys) || [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value){
          const id = k.replace('report:', '');
          reports[id] = JSON.parse(r.value);
        }
      }catch(e){}
    }
  }catch(e){ /* pas de rapports encore, ou storage indisponible : on continue avec les données de base */ }
  render();
}

async function fileReport(terrainId, status){
  const existing = reports[terrainId];
  const count = existing && (Date.now() - existing.ts) < REPORT_TTL_MS ? existing.count + 1 : 1;
  const payload = {status, ts: Date.now(), count};
  try{
    await window.storage.set('report:' + terrainId, JSON.stringify(payload), true);
  }catch(e){}
  reports[terrainId] = payload;
  render();
  const t = TERRAINS.find(x=>x.id===terrainId);
  if(t) openPopup(t, true);
}

function effectiveStatus(t){
  const r = reports[t.id];
  if(r && (Date.now() - r.ts) < REPORT_TTL_MS){
    return {status: r.status === 'occupe' ? 'signale' : r.status, fresh:true, ts:r.ts, count:r.count};
  }
  const slot = activeSlotNow(t.reservedSlots);
  if(slot){
    const hh = String(Math.floor(slot.endMin/60)).padStart(2,'0');
    const mm = String(slot.endMin%60).padStart(2,'0');
    return {status:slot.status, fresh:false, scheduled:true, note:`${slot.label || STATUS_LABEL[slot.status]} jusqu'à ${hh}:${mm}`};
  }
  return {status: t.base, fresh:false};
}

function timeAgo(ts){
  const min = Math.round((Date.now()-ts)/60000);
  if(min < 1) return 'à l\'instant';
  if(min === 1) return 'il y a 1 min';
  if(min < 60) return `il y a ${min} min`;
  return `il y a ${Math.round(min/60)} h`;
}

/* =====================================================================
   CARTE
   ===================================================================== */
const map = L.map('map', {zoomControl:false}).setView([45.5301, -73.6000], 12);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO',
  maxZoom:19,
}).addTo(map);

let mapUserMoved = false;
let isProgrammaticMove = false;
map.on('movestart', ()=>{ if(!isProgrammaticMove) mapUserMoved = true; });

function pinIcon(status, fresh){
  return L.divIcon({
    className:'',
    html:`<div class="pin s-${status} ${fresh?'pin-fresh':''}" style="position:relative;"></div>`,
    iconSize:[22,22],
    iconAnchor:[11,20],
    popupAnchor:[0,-18],
  });
}

function openPopup(t, keepView){
  const eff = effectiveStatus(t);
  const m = markers[t.id];
  const freshLine = eff.fresh ? `<div class="pop-note">Signalé ${timeAgo(eff.ts)} · ${eff.count} signalement${eff.count>1?'s':''}</div>`
    : (eff.scheduled ? `<div class="pop-note">${eff.note}</div>` : '');
  const notesLine = t.notes ? `<div class="pop-note" style="margin-top:6px;">${t.notes}</div>` : '';
  const sourceLine = t.source ? `<div class="pop-note" style="opacity:.6;margin-top:4px;">Source : ${t.source}</div>` : '';
  const imgSrc = t.imageUrl || satImageUrl(t.lat, t.lng);
  const imgTag = t.imageUrl ? '' : 'vue satellite';
  const imgHtml = `
    <div class="pop-img-wrap">
      <img class="pop-img" src="${imgSrc}" alt="Aperçu de ${t.name}"
           onerror="this.closest('.pop-img-wrap').style.display='none'">
      ${imgTag ? `<span class="pop-img-tag">${imgTag}</span>` : ''}
    </div>`;
  const html = `
    ${imgHtml}
    <div class="pop-name">${t.name}</div>
    <div class="pop-addr">${t.addr}${t.arrondissement ? ' · ' + t.arrondissement : ''}</div>
    <div class="pop-status s-${eff.status}">● ${STATUS_LABEL[eff.status]}</div>
    <div class="pop-actions">
      <button class="btn-report" onclick="fileReport('${t.id}','libre')">Signaler libre</button>
      <button class="btn-report" onclick="fileReport('${t.id}','occupe')">Signaler occupé</button>
    </div>
    <a class="btn-reserve" href="${t.reserveUrl}" target="_blank" rel="noopener">Réserver sur montreal.ca ↗</a>
    ${freshLine}
    ${notesLine}
    ${sourceLine}
  `;
  if(m){
    m.setPopupContent(html);
    m.openPopup();
    if(!keepView) map.panTo([t.lat, t.lng]);
  }
}
window.fileReport = fileReport;

/* =====================================================================
   RENDU
   ===================================================================== */
function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = SPORTS.map(s=>`
    <div class="chip ${s.id===activeSport?'active':''} ${!s.enabled?'disabled':''}"
         onclick="${s.enabled ? `setSport('${s.id}')` : ''}">
      ${s.label}${!s.enabled?' · bientôt':''}
    </div>
  `).join('');
}
window.setSport = (id)=>{ activeSport = id; render(); };

function renderScoreboard(list){
  const counts = {libre:0, priorite:0, occupe:0, signale:0};
  list.forEach(t=>{ counts[effectiveStatus(t).status]++; });
  const el = document.getElementById('scoreboard');
  el.innerHTML = `
    <div class="sb-item"><span class="sb-dot s-libre"></span>Libre — ${counts.libre}</div>
    <div class="sb-item"><span class="sb-dot s-priorite"></span>Priorité résa — ${counts.priorite}</div>
    <div class="sb-item"><span class="sb-dot s-occupe"></span>Occupé — ${counts.occupe}</div>
    <div class="sb-item"><span class="sb-dot s-signale"></span>Signalé — ${counts.signale}</div>
  `;
}

function renderList(list){
  const body = document.getElementById('listBody');
  document.getElementById('listTitle').textContent = `Terrains — ${SPORTS.find(s=>s.id===activeSport).label}`;
  document.getElementById('counter').textContent = `${list.length} terrains suivis`;
  body.innerHTML = list.map(t=>{
    const eff = effectiveStatus(t);
    return `
      <div class="card ${t.id===selectedId?'selected':''}" onclick="selectTerrain('${t.id}')">
        <div class="card-top">
          <div class="card-name">${t.name}</div>
          <div class="status-pill s-${eff.status}">${STATUS_LABEL[eff.status]}</div>
        </div>
        <div class="card-meta">
          <span>${t.addr}${t.arrondissement ? ' · ' + t.arrondissement : ''}</span>
          ${eff.fresh ? `<span>${timeAgo(eff.ts)}</span>` : (eff.scheduled ? `<span>${eff.note}</span>` : '')}
        </div>
      </div>
    `;
  }).join('');
}
window.selectTerrain = (id)=>{
  selectedId = id;
  const t = TERRAINS.find(x=>x.id===id);
  if(t){ map.setView([t.lat,t.lng], 15); openPopup(t); }
  renderList(currentList());
};

function currentList(){
  return TERRAINS.filter(t=>t.sport===activeSport);
}

function render(){
  const list = currentList();
  renderFilters();
  renderList(list);
  renderScoreboard(list);

  // (re)pose les marqueurs
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};
  list.forEach(t=>{
    const eff = effectiveStatus(t);
    const m = L.marker([t.lat,t.lng], {icon: pinIcon(eff.status, eff.fresh)}).addTo(map);
    m.bindPopup('', {closeButton:true, className:'', offset:[0,-4]});
    m.on('click', ()=>{ selectedId=t.id; openPopup(t, true); renderList(currentList()); });
    markers[t.id] = m;
  });

  // recadre la carte pour que tous les terrains affichés soient visibles
  if(!mapUserMoved && list.length){
    isProgrammaticMove = true;
    const bounds = L.latLngBounds(list.map(t=>[t.lat, t.lng]));
    map.fitBounds(bounds, {padding:[50,50], maxZoom:14});
    isProgrammaticMove = false;
  }

  document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
}

(async function start(){
  await loadTerrainsFromCSV();
  await loadReports(); // loadReports() appelle déjà render() à la fin
})();
setInterval(render, 30000); // rafraîchit l'affichage des "il y a X min" et purge les signalements expirés
setInterval(loadTerrainsFromCSV, 5 * 60 * 1000); // relit terrains.csv toutes les 5 min, sans recharger la page
</script>
</body>
